name: Publish homologation image to GHCR

on:
  push:
    branches: [artgenial/develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: hml-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/jeduardocampos10/artgenial-hml-frontend

jobs:
  publish:
    if: github.ref == 'refs/heads/artgenial/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable commit tag
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.16.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_AUTH_API_URL=${{ vars.VITE_AUTH_API_URL }}
            VITE_WS_URL=${{ vars.VITE_WS_URL }}
            VITE_EVOAI_API_URL=${{ vars.VITE_EVOAI_API_URL }}
            VITE_AGENT_PROCESSOR_URL=${{ vars.VITE_AGENT_PROCESSOR_URL }}
            VITE_EVOFLOW_API_URL=${{ vars.VITE_EVOFLOW_API_URL }}
          cache-from: type=gha,scope=hml-amd64
          cache-to: type=gha,scope=hml-amd64,mode=max
